openapi: 3.0.0
paths:
  /users/me:
    get:
      operationId: CurrentUserController_me
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponseDto"
      summary: Get the authenticated user
      tags:
        - users
  /users/{id}/role:
    patch:
      operationId: UserRolesController_assign
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignRoleDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignedRoleResponseDto"
      summary: Assign any role to a user (admin only)
      tags:
        - users
  /milestones:
    get:
      operationId: MilestonesController_list
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MilestoneDto"
      summary: List milestones
      tags:
        - milestones
  /milestones/{id}:
    get:
      operationId: MilestonesController_get
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneDto"
      summary: Get a milestone
      tags:
        - milestones
  /milestones/{id}/evidence:
    post:
      operationId: MilestonesController_addEvidence
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitEvidenceDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneDto"
      summary: Producer submits evidence for verification
      tags:
        - milestones
  /milestones/{id}/review:
    post:
      operationId: MilestonesController_review
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewMilestoneDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneDto"
      summary: Verifier approves or observes the evidence. Approving pays the producer
        line.
      tags:
        - milestones
  /milestones/{id}/funding:
    post:
      operationId: MilestonesController_startFunding
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundingStartDto"
      summary: "Starts funding: send the browser to redirectUrl so the custody wallet
        holder approves one grant capped at the milestone amount"
      tags:
        - milestones
  /milestones/{id}/lines/{lineId}/payment:
    post:
      operationId: MilestonesController_payLine
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: lineId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneDto"
      summary: Operator pays one line of a funded milestone. Supplier lines can be
        paid before approval, the producer line cannot.
      tags:
        - milestones
  /milestones/{id}/lines/sync:
    post:
      operationId: MilestonesController_sync
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneDto"
      summary: Operator resolves the lines the gateway left en_cola
      tags:
        - milestones
  /api/producer/projects:
    get:
      operationId: ProjectsController_listProducerProjects
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectResponseDto"
      summary: Projects owned by the signed-in producer, oldest first
      tags:
        - projects
  /api/projects/{projectId}:
    get:
      operationId: ProjectsController_getProject
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponseDto"
        "404":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
      summary: Get a project; another producer's project is a 404
      tags:
        - projects
  /api/projects:
    post:
      operationId: ProjectsController_createProject
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequestDto"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponseDto"
        "400":
          description: errors keyed by field path, e.g. milestones.2.laborBudget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
      summary: Create a DRAFT project with its ordered milestones; the caller is the
        owner. Budgets in whole pesos.
      tags:
        - projects
  /api/projects/{projectId}/milestones:
    get:
      operationId: ProjectsController_listMilestones
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MilestoneSummaryResponseDto"
        "404":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
      summary: A project's milestones in sequence order, with their derived status
      tags:
        - projects
  /api/milestones/{id}:
    get:
      operationId: ProducerMilestonesController_getMilestone
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneDetailResponseDto"
        "404":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
      summary: "Milestone detail: requirements, evidence logs and review history"
      tags:
        - projects
  /api/milestones/{id}/logs:
    post:
      operationId: ProducerMilestonesController_addLog
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceLogRequestDto"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceLogResponseDto"
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "409":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
      summary: Producer records a field log; 409 when the status takes no evidence,
        400 when the payload misses the requirements
      tags:
        - projects
  /api/milestones/{id}/submit:
    post:
      operationId: ProducerMilestonesController_submit
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneDetailResponseDto"
        "409":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
      summary: Producer submits for review once the latest value of every requirement
        is met; 409 otherwise
      tags:
        - projects
info:
  title: Agro Payments API
  description: ""
  version: 0.1.0
  contact: {}
tags: []
servers: []
components:
  schemas:
    CurrentUserResponseDto:
      type: object
      properties:
        role:
          enum:
            - admin
            - buyer
            - seller
            - investor
            - fidu
            - intermediator
          type: string
        id:
          type: string
        email:
          type: string
        name:
          type: string
      required:
        - role
        - id
        - email
        - name
    AssignRoleDto:
      type: object
      properties:
        role:
          description: New role for the user
          enum:
            - admin
            - buyer
            - seller
            - investor
            - fidu
            - intermediator
          type: string
      required:
        - role
    AssignedRoleResponseDto:
      type: object
      properties:
        role:
          enum:
            - admin
            - buyer
            - seller
            - investor
            - fidu
            - intermediator
          type: string
        id:
          type: string
      required:
        - role
        - id
    MilestoneStatus:
      type: string
      enum:
        - draft
        - evidence_submitted
        - approved
        - observado
    EvidenceDto:
      type: object
      properties:
        description:
          type: string
        submittedAt:
          format: date-time
          type: string
      required:
        - description
        - submittedAt
    Decision:
      type: string
      enum:
        - approved
        - observado
    ReviewDto:
      type: object
      properties:
        decision:
          allOf:
            - $ref: "#/components/schemas/Decision"
        reason:
          type: string
          nullable: true
        reviewedAt:
          format: date-time
          type: string
      required:
        - decision
        - reason
        - reviewedAt
    LineKind:
      type: string
      enum:
        - productor
        - proveedor
        - trabajadores
        - plataforma
    LineStatus:
      type: string
      enum:
        - pendiente
        - en_cola
        - completado
        - fallido
    ReceiptAmountDto:
      type: object
      properties:
        value:
          type: number
          description: Integer minor units of assetCode
        assetCode:
          type: string
        assetScale:
          type: number
      required:
        - value
        - assetCode
        - assetScale
    LineReceiptDto:
      type: object
      properties:
        incomingPaymentId:
          type: string
          nullable: true
        outgoingPaymentId:
          type: string
          nullable: true
        quoteId:
          type: string
          nullable: true
        debitAmount:
          nullable: true
          description: Charged to the milestone grant on the custody wallet
          type: object
          allOf:
            - $ref: "#/components/schemas/ReceiptAmountDto"
        receiveAmount:
          nullable: true
          description: "Credited to the beneficiary: quoted while en_cola, settled once
            completado"
          type: object
          allOf:
            - $ref: "#/components/schemas/ReceiptAmountDto"
        rate:
          type: string
          nullable: true
          description: Implied receive/debit rate in major units, as a reduced
            "numerator/denominator" string
          example: 300/301
        fee:
          type: number
          nullable: true
          description: debit − receive in debit minor units; null when the assets differ
        grantSpentBefore:
          type: number
          nullable: true
          description: Grant debit total before this payment, minor units
        grantSpentAfter:
          type: number
          nullable: true
          description: Grant debit total re-read after settlement, minor units
      required:
        - incomingPaymentId
        - outgoingPaymentId
        - quoteId
        - debitAmount
        - receiveAmount
        - rate
        - fee
        - grantSpentBefore
        - grantSpentAfter
    LineDto:
      type: object
      properties:
        kind:
          allOf:
            - $ref: "#/components/schemas/LineKind"
        status:
          allOf:
            - $ref: "#/components/schemas/LineStatus"
        reference:
          type: string
          nullable: true
          description: Gateway payment reference; simulated ones start with SIM-, Open
            Payments ones hold the incoming and outgoing payment URLs
        settledAt:
          format: date-time
          type: string
          nullable: true
        receipt:
          nullable: true
          description: Null until the gateway reports the payment (simulated payments have
            none)
          type: object
          allOf:
            - $ref: "#/components/schemas/LineReceiptDto"
        id:
          type: string
        beneficiary:
          type: string
        walletAddress:
          type: string
        amount:
          type: number
          description: Integer minor units (see assetScale)
      required:
        - kind
        - status
        - reference
        - settledAt
        - receipt
        - id
        - beneficiary
        - walletAddress
        - amount
    MilestoneDto:
      type: object
      properties:
        status:
          allOf:
            - $ref: "#/components/schemas/MilestoneStatus"
        evidence:
          nullable: true
          type: object
          allOf:
            - $ref: "#/components/schemas/EvidenceDto"
        review:
          nullable: true
          type: object
          allOf:
            - $ref: "#/components/schemas/ReviewDto"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/LineDto"
        fundedAt:
          format: date-time
          type: string
          nullable: true
          description: Set when the custody grant that funds the lines was approved; no
            line is paid before
        closedAt:
          format: date-time
          type: string
          nullable: true
          description: Set once every line is completado or fallido
        id:
          type: string
        title:
          type: string
        amount:
          type: number
          description: "Integer minor units: amount / 10^assetScale is the human value"
        currency:
          type: string
          description: ISO 4217 code
        assetScale:
          type: number
          description: Decimal places of the minor unit (COP demo data uses 2)
      required:
        - status
        - evidence
        - review
        - lines
        - fundedAt
        - closedAt
        - id
        - title
        - amount
        - currency
        - assetScale
    SubmitEvidenceDto:
      type: object
      properties:
        description:
          type: string
          description: What the producer did and what the evidence shows
      required:
        - description
    ReviewMilestoneDto:
      type: object
      properties:
        decision:
          allOf:
            - $ref: "#/components/schemas/Decision"
        reason:
          type: string
          description: "Required when observing: what the producer must correct"
      required:
        - decision
    FundingStartDto:
      type: object
      properties:
        redirectUrl:
          type: string
          description: Wallet consent page; the browser leaves the app and comes back
            through the funding callback
      required:
        - redirectUrl
    ProjectStatus:
      type: string
      enum:
        - DRAFT
        - CONTRACT_SIGNED
        - FUNDING_IN_PROGRESS
        - FUNDED_IN_CUSTODY
        - IN_EXECUTION
        - HARVEST_DECLARED
        - HARVEST_CERTIFIED
        - LISTED_IN_MARKET
        - MARKET_PAYMENT_HELD
        - DELIVERED_TO_BUYER
        - SETTLEMENT_PROCESSING
        - SETTLED_AND_CLOSED
        - CANCELLED_OR_DISPUTED
    ProjectResponseDto:
      type: object
      properties:
        current_status:
          allOf:
            - $ref: "#/components/schemas/ProjectStatus"
        id:
          type: string
        project_code:
          type: string
          description: AGR-YYYY-NNN, sequential per year
        title:
          type: string
        production_type:
          type: string
        description:
          type: string
        target_amount:
          type: number
          description: Σ(supplies + labor) of the milestones, whole pesos; the platform
            fee is on top
        custody_balance:
          type: number
        total_disbursed:
          type: number
        investor_roi_pct:
          type: number
        platform_fee_pct:
          type: number
        start_date:
          type: string
          description: yyyy-mm-dd
        estimated_end_date:
          type: string
        currency:
          type: string
      required:
        - current_status
        - id
        - project_code
        - title
        - production_type
        - description
        - target_amount
        - custody_balance
        - total_disbursed
        - investor_roi_pct
        - platform_fee_pct
        - start_date
        - estimated_end_date
        - currency
    ApiErrorDto:
      type: object
      properties:
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        error:
          type: string
      required:
        - errors
        - error
    RequirementDto:
      type: object
      properties:
        type:
          enum:
            - number
            - boolean_system_check
            - photo_array
          type: string
        field_key:
          type: string
        label:
          type: string
        min:
          type: number
        max:
          type: number
        min_items:
          type: number
      required:
        - type
        - field_key
        - label
    RequirementsSchemaDto:
      type: object
      properties:
        required_evidences:
          type: array
          items:
            $ref: "#/components/schemas/RequirementDto"
      required:
        - required_evidences
    CreateProjectMilestoneRequestDto:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        estimated_completion_date:
          type: string
          description: yyyy-mm-dd, within the project period
        supplies_budget:
          type: number
          description: Whole pesos
        labor_budget:
          type: number
          description: Whole pesos; must be above zero (it pays the producer line)
        sequence_order:
          type: number
          description: 1-based; milestones open in this order
        requirements_schema:
          $ref: "#/components/schemas/RequirementsSchemaDto"
      required:
        - title
        - description
        - estimated_completion_date
        - supplies_budget
        - labor_budget
        - sequence_order
        - requirements_schema
    CreateProjectRequestDto:
      type: object
      properties:
        production_type:
          type: string
          enum:
            - CAFE_ESPECIAL
            - CACAO
            - AGUACATE_HASS
            - OTRO
        milestones:
          type: array
          items:
            $ref: "#/components/schemas/CreateProjectMilestoneRequestDto"
        title:
          type: string
        description:
          type: string
        start_date:
          type: string
        estimated_end_date:
          type: string
      required:
        - production_type
        - milestones
        - title
        - description
        - start_date
        - estimated_end_date
    MilestoneProgressStatus:
      type: string
      enum:
        - LOCKED
        - ACTIVE
        - SUPPLIES_ORDERED
        - SUPPLIES_PAID
        - IN_FIELD_EXECUTION
        - SUBMITTED_FOR_REVIEW
        - CHANGES_REQUESTED
        - TECHNICALLY_APPROVED
        - LABOR_PAYOUT_PENDING
        - COMPLETED_AND_PAID
      description: Derived from the milestone, its lines and the project order (see
        milestone-progress.ts)
    MilestoneSummaryResponseDto:
      type: object
      properties:
        status:
          description: Derived from the milestone, its lines and the project order (see
            milestone-progress.ts)
          allOf:
            - $ref: "#/components/schemas/MilestoneProgressStatus"
        id:
          type: string
        project_id:
          type: string
          description: Empty for the legacy demo milestones, which belong to no project
        sequence_order:
          type: number
          description: 0 for the legacy demo milestones
        title:
          type: string
        supplies_budget:
          type: number
          description: Σ proveedor lines
        labor_budget:
          type: number
          description: Σ productor + trabajadores lines
        supplies_executed:
          type: number
        labor_executed:
          type: number
        currency:
          type: string
      required:
        - status
        - id
        - project_id
        - sequence_order
        - title
        - supplies_budget
        - labor_budget
        - supplies_executed
        - labor_executed
        - currency
    EvidenceLogType:
      type: string
      enum:
        - PHOTO_EVIDENCE
        - SOIL_ANALYSIS
        - IOT_READING
        - WEATHER_ALERT
        - AGRONOMIC_NOTE
    EvidenceLogResponseDto:
      type: object
      properties:
        log_type:
          allOf:
            - $ref: "#/components/schemas/EvidenceLogType"
        evidence_payload:
          type: object
          additionalProperties:
            oneOf:
              - type: number
              - type: boolean
              - type: array
                items:
                  type: string
        id:
          type: string
        milestone_id:
          type: string
        notes:
          type: string
        created_at:
          type: string
      required:
        - log_type
        - evidence_payload
        - id
        - milestone_id
        - notes
        - created_at
    MilestoneReviewVerdict:
      type: string
      enum:
        - SUBMITTED
        - CHANGES_REQUESTED
        - APPROVED_FAVORABLE
        - PAYOUT_EXECUTED
    MilestoneReviewResponseDto:
      type: object
      properties:
        verdict:
          allOf:
            - $ref: "#/components/schemas/MilestoneReviewVerdict"
        comment:
          type: string
          nullable: true
        id:
          type: string
        created_at:
          type: string
      required:
        - verdict
        - comment
        - id
        - created_at
    MilestoneDetailResponseDto:
      type: object
      properties:
        status:
          description: Derived from the milestone, its lines and the project order (see
            milestone-progress.ts)
          allOf:
            - $ref: "#/components/schemas/MilestoneProgressStatus"
        required_evidences:
          type: array
          items:
            $ref: "#/components/schemas/RequirementDto"
        evidence_logs:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceLogResponseDto"
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/MilestoneReviewResponseDto"
        description:
          type: string
        estimated_completion_date:
          type: string
          description: yyyy-mm-dd; omitted when unknown (legacy demo milestones)
        id:
          type: string
        project_id:
          type: string
          description: Empty for the legacy demo milestones, which belong to no project
        sequence_order:
          type: number
          description: 0 for the legacy demo milestones
        title:
          type: string
        supplies_budget:
          type: number
          description: Σ proveedor lines
        labor_budget:
          type: number
          description: Σ productor + trabajadores lines
        supplies_executed:
          type: number
        labor_executed:
          type: number
        currency:
          type: string
      required:
        - status
        - required_evidences
        - evidence_logs
        - reviews
        - description
        - id
        - project_id
        - sequence_order
        - title
        - supplies_budget
        - labor_budget
        - supplies_executed
        - labor_executed
        - currency
    EvidenceLogRequestDto:
      type: object
      properties:
        log_type:
          allOf:
            - $ref: "#/components/schemas/EvidenceLogType"
        evidence_payload:
          type: object
          additionalProperties:
            oneOf:
              - type: number
              - type: boolean
              - type: array
                items:
                  type: string
          description: "Exactly the milestone's required_evidences keys: numbers within
            min/max, booleans, http(s) photo URLs"
        notes:
          type: string
          description: At most 1000 characters
      required:
        - log_type
        - evidence_payload
        - notes
