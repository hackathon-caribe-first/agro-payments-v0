openapi: 3.0.0
paths:
  /users/me:
    get:
      operationId: CurrentUserController_me
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponseDto"
      summary: Get the authenticated user
      tags:
        - users
  /users/{id}/role:
    patch:
      operationId: UserRolesController_assign
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignRoleDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignedRoleResponseDto"
      summary: Assign any role to a user (admin only)
      tags:
        - users
  /milestones:
    get:
      operationId: MilestonesController_list
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MilestoneDto"
      summary: List milestones
      tags:
        - milestones
  /milestones/{id}:
    get:
      operationId: MilestonesController_get
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneDto"
      summary: Get a milestone
      tags:
        - milestones
  /milestones/{id}/evidence:
    post:
      operationId: MilestonesController_addEvidence
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitEvidenceDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneDto"
      summary: Producer submits evidence for verification
      tags:
        - milestones
  /milestones/{id}/review:
    post:
      operationId: MilestonesController_review
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewMilestoneDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneDto"
      summary: Verifier approves or observes the evidence. Approving pays the producer
        line.
      tags:
        - milestones
  /milestones/{id}/lines/{lineId}/payment:
    post:
      operationId: MilestonesController_payLine
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: lineId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneDto"
      summary: Operator pays one line. Supplier lines can be paid before approval, the
        producer line cannot.
      tags:
        - milestones
  /milestones/{id}/lines/sync:
    post:
      operationId: MilestonesController_sync
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneDto"
      summary: Operator resolves the lines the gateway left en_cola
      tags:
        - milestones
info:
  title: Agro Payments API
  description: ""
  version: 0.1.0
  contact: {}
tags: []
servers: []
components:
  schemas:
    CurrentUserResponseDto:
      type: object
      properties:
        role:
          enum:
            - admin
            - buyer
            - seller
            - investor
            - fidu
            - intermediator
          type: string
        id:
          type: string
        email:
          type: string
        name:
          type: string
      required:
        - role
        - id
        - email
        - name
    AssignRoleDto:
      type: object
      properties:
        role:
          description: New role for the user
          enum:
            - admin
            - buyer
            - seller
            - investor
            - fidu
            - intermediator
          type: string
      required:
        - role
    AssignedRoleResponseDto:
      type: object
      properties:
        role:
          enum:
            - admin
            - buyer
            - seller
            - investor
            - fidu
            - intermediator
          type: string
        id:
          type: string
      required:
        - role
        - id
    MilestoneStatus:
      type: string
      enum:
        - draft
        - evidence_submitted
        - approved
        - observado
    EvidenceDto:
      type: object
      properties:
        description:
          type: string
        submittedAt:
          format: date-time
          type: string
      required:
        - description
        - submittedAt
    Decision:
      type: string
      enum:
        - approved
        - observado
    ReviewDto:
      type: object
      properties:
        decision:
          allOf:
            - $ref: "#/components/schemas/Decision"
        reason:
          type: string
          nullable: true
        reviewedAt:
          format: date-time
          type: string
      required:
        - decision
        - reason
        - reviewedAt
    LineKind:
      type: string
      enum:
        - productor
        - proveedor
        - trabajadores
        - plataforma
    LineStatus:
      type: string
      enum:
        - pendiente
        - en_cola
        - completado
        - fallido
    LineDto:
      type: object
      properties:
        kind:
          allOf:
            - $ref: "#/components/schemas/LineKind"
        status:
          allOf:
            - $ref: "#/components/schemas/LineStatus"
        reference:
          type: string
          nullable: true
          description: Gateway payment reference; simulated ones start with SIM-
        settledAt:
          format: date-time
          type: string
          nullable: true
        id:
          type: string
        beneficiary:
          type: string
        walletAddress:
          type: string
        amount:
          type: number
          description: Integer minor units (see assetScale)
      required:
        - kind
        - status
        - reference
        - settledAt
        - id
        - beneficiary
        - walletAddress
        - amount
    MilestoneDto:
      type: object
      properties:
        status:
          allOf:
            - $ref: "#/components/schemas/MilestoneStatus"
        evidence:
          nullable: true
          type: object
          allOf:
            - $ref: "#/components/schemas/EvidenceDto"
        review:
          nullable: true
          type: object
          allOf:
            - $ref: "#/components/schemas/ReviewDto"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/LineDto"
        closedAt:
          format: date-time
          type: string
          nullable: true
          description: Set once every line is completado or fallido
        id:
          type: string
        title:
          type: string
        amount:
          type: number
          description: "Integer minor units: amount / 10^assetScale is the human value"
        currency:
          type: string
          description: ISO 4217 code
        assetScale:
          type: number
          description: Decimal places of the minor unit (COP demo data uses 2)
      required:
        - status
        - evidence
        - review
        - lines
        - closedAt
        - id
        - title
        - amount
        - currency
        - assetScale
    SubmitEvidenceDto:
      type: object
      properties:
        description:
          type: string
          description: What the producer did and what the evidence shows
      required:
        - description
    ReviewMilestoneDto:
      type: object
      properties:
        decision:
          allOf:
            - $ref: "#/components/schemas/Decision"
        reason:
          type: string
          description: "Required when observing: what the producer must correct"
      required:
        - decision
