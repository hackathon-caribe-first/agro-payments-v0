openapi: 3.0.0
paths:
  /users/me:
    get:
      operationId: CurrentUserController_me
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponseDto"
      summary: Get the authenticated user
      tags:
        - users
  /users/{id}/role:
    patch:
      operationId: UserRolesController_assign
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignRoleDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignedRoleResponseDto"
      summary: Assign any role to a user (admin only)
      tags:
        - users
  /milestones:
    get:
      operationId: MilestonesController_list
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MilestoneDto"
      summary: List milestones
      tags:
        - milestones
  /milestones/{id}:
    get:
      operationId: MilestonesController_get
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneDto"
      summary: Get a milestone
      tags:
        - milestones
  /milestones/{id}/evidence:
    post:
      operationId: MilestonesController_addEvidence
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitEvidenceDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneDto"
      summary: Producer submits evidence for verification
      tags:
        - milestones
  /milestones/{id}/review:
    post:
      operationId: MilestonesController_review
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewMilestoneDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneDto"
      summary: Verifier approves or observes the evidence. Approving pays the jornales
        line and the milestone fee (RF-20).
      tags:
        - milestones
  /milestones/{id}/funding:
    post:
      operationId: MilestonesController_startFunding
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundingStartDto"
      summary: "RF-13: the fiduciaria starts the milestone grant; send the browser to
        redirectUrl to approve it on the custody wallet. 409 while another
        milestone of the project holds a live grant"
      tags:
        - milestones
  /milestones/{id}/lines/{lineId}/payment:
    post:
      operationId: MilestonesController_payLine
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: lineId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneDto"
      summary: Operator pays one line of a funded milestone. Supplier lines can be
        paid before approval, the producer line cannot.
      tags:
        - milestones
  /milestones/{id}/lines/sync:
    post:
      operationId: MilestonesController_sync
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneDto"
      summary: Operator resolves the lines the gateway left en_cola
      tags:
        - milestones
  /api/support/traces:
    get:
      operationId: SupportController_list
      parameters:
        - name: project_id
          required: false
          in: query
          schema:
            type: string
        - name: limit
          required: false
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: Open Payments requests as curl (RF-28); ?project_id narrows to one
        project, ?limit (default 100, max 500)
      tags:
        - support
  /api/producer/projects:
    get:
      operationId: ProjectsController_listProducerProjects
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectResponseDto"
      summary: Projects owned by the signed-in producer, oldest first
      tags:
        - projects
  /api/projects/{projectId}:
    get:
      operationId: ProjectsController_getProject
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponseDto"
        "404":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
      summary: Get a project; another producer's project is a 404
      tags:
        - projects
  /api/projects:
    post:
      operationId: ProjectsController_createProject
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequestDto"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponseDto"
        "400":
          description: errors keyed by field path, e.g. milestones.2.laborBudget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
      summary: Create a DRAFT project with its ordered milestones; the caller is the
        owner. Budgets in whole pesos.
      tags:
        - projects
  /api/projects/{projectId}/milestones:
    get:
      operationId: ProjectsController_listMilestones
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MilestoneSummaryResponseDto"
        "404":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
      summary: A project's milestones in sequence order, with their derived status
      tags:
        - projects
  /api/milestones/{id}:
    get:
      operationId: ProducerMilestonesController_getMilestone
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneDetailResponseDto"
        "404":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
      summary: "Milestone detail: requirements, evidence logs and review history"
      tags:
        - projects
  /api/milestones/{id}/logs:
    post:
      operationId: ProducerMilestonesController_addLog
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceLogRequestDto"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceLogResponseDto"
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
        "409":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
      summary: Producer records a field log; 409 when the status takes no evidence,
        400 when the payload misses the requirements
      tags:
        - projects
  /api/milestones/{id}/submit:
    post:
      operationId: ProducerMilestonesController_submit
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneDetailResponseDto"
        "409":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorDto"
      summary: Producer submits for review once the latest value of every requirement
        is met; 409 otherwise
      tags:
        - projects
  /api/catalog/projects:
    get:
      operationId: NegotiationsController_listCatalog
      parameters: []
      responses:
        "200":
          description: ""
      summary: Every project that is not cancelled, with its producer and derived
        negotiation locks
      tags:
        - negotiations
  /api/catalog/projects/{projectId}:
    get:
      operationId: NegotiationsController_getCatalogProject
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags:
        - negotiations
  /api/projects/{projectId}/negotiations:
    post:
      operationId: NegotiationsController_startNegotiation
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                type: object
      summary: The buyer opens a negotiation on the project (scope PROJECT) or on one
        milestone (scope MILESTONE)
      tags:
        - negotiations
  /api/quote-requests/{id}:
    get:
      operationId: NegotiationsController_getQuoteRequest
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      tags:
        - negotiations
  /api/buyers/{buyerId}/quote-requests:
    get:
      operationId: NegotiationsController_listBuyerQuoteRequests
      parameters:
        - name: buyerId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
      tags:
        - negotiations
  /api/producer/quote-requests:
    get:
      operationId: NegotiationsController_listProducerQuoteRequests
      parameters:
        - name: project_id
          required: false
          in: query
          schema:
            type: string
        - name: producer_id
          required: false
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
      tags:
        - negotiations
  /api/quote-requests/{id}/quotes:
    post:
      operationId: NegotiationsController_counter
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                type: object
      summary: An offer or counter-offer; `author` (default PRODUCER) must be the
        caller's side of the negotiation
      tags:
        - negotiations
  /api/quote-requests/{id}/quotes/{revision}/accept:
    post:
      operationId: NegotiationsController_accept
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: revision
          required: true
          in: path
          schema:
            type: number
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      summary: Accepts the latest offer; a BUYER accept of a PROJECT offer also
        deposits (or returns deposit_redirect_url in open-payments mode)
      tags:
        - negotiations
  /api/quote-requests/{id}/quotes/{revision}/reject:
    post:
      operationId: NegotiationsController_reject
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: revision
          required: true
          in: path
          schema:
            type: number
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      tags:
        - negotiations
  /api/quote-requests/{id}/cancel:
    post:
      operationId: NegotiationsController_cancel
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      tags:
        - negotiations
  /api/quote-requests/{id}/decline:
    post:
      operationId: NegotiationsController_decline
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      tags:
        - negotiations
  /api/quote-requests/{id}/withdraw:
    post:
      operationId: NegotiationsController_withdraw
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      tags:
        - negotiations
  /api/negotiations/{id}/deposit:
    post:
      operationId: NegotiationsController_deposit
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      summary: Executes the pending deposit of an agreed PROJECT negotiation; in
        open-payments mode answers PENDING + deposit_redirect_url
      tags:
        - negotiations
  /api/projects/{projectId}/escrow-ledger:
    get:
      operationId: NegotiationsController_ledger
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: The project's custody ledger (buyer deposits)
      tags:
        - negotiations
  /api/open-requests:
    get:
      operationId: NegotiationsController_listOpenRequests
      parameters:
        - name: status
          required: false
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags:
        - negotiations
    post:
      operationId: NegotiationsController_createOpenRequest
      parameters: []
      responses:
        "201":
          description: ""
      tags:
        - negotiations
  /api/buyers/{buyerId}/open-requests:
    get:
      operationId: NegotiationsController_listBuyerOpenRequests
      parameters:
        - name: buyerId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags:
        - negotiations
  /api/open-requests/{id}:
    get:
      operationId: NegotiationsController_getOpenRequest
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags:
        - negotiations
  /api/open-requests/{id}/close:
    post:
      operationId: NegotiationsController_closeOpenRequest
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags:
        - negotiations
  /api/open-requests/{id}/negotiations:
    get:
      operationId: NegotiationsController_listOpenRequestNegotiations
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
      tags:
        - negotiations
    post:
      operationId: NegotiationsController_startOpenRequestNegotiation
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                type: object
      summary: A producer's first offer on an open request, backed by one of their own
        projects
      tags:
        - negotiations
  /api/projects/{projectId}/investments:
    post:
      operationId: InvestmentsController_invest
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        "201":
          description: ""
      summary: "Subscribes the caller (role investor): 201 CAPTURED (simulated) or
        PENDING_CONSENT with consent_redirect_url"
      tags:
        - investments
    get:
      operationId: InvestmentsController_list
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: An investor sees their own; the owner producer, admin and fidu see all
      tags:
        - investments
  /api/investments/{id}:
    get:
      operationId: InvestmentsController_get
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags:
        - investments
  /api/projects/{projectId}/capture:
    get:
      operationId: InvestmentsController_capture
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: "The capture bar: captured COP against the target, by the investors'
        currencies"
      tags:
        - investments
  /api/investor/projects:
    get:
      operationId: InvestmentsController_fundable
      parameters: []
      responses:
        "200":
          description: ""
      summary: "The investor catalog: projects still raising (DRAFT, CONTRACT_SIGNED,
        FUNDING_IN_PROGRESS) with their capture bar"
      tags:
        - investments
  /api/investor/projects/{projectId}:
    get:
      operationId: InvestmentsController_investorProject
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: One project with its capture bar, whatever its status
      tags:
        - investments
  /api/projects/{projectId}/settlement/preview:
    post:
      operationId: SettlementController_preview
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: The cascade for these terms; nothing is stored. Amounts in whole pesos.
      tags:
        - settlement
  /api/projects/{projectId}/settlement:
    post:
      operationId: SettlementController_create
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        "201":
          description: ""
      summary: Stores the cascade as a draft settlement; 409 while the project has an
        approved, executing or executed one
      tags:
        - settlement
  /api/settlements/{id}/approve:
    post:
      operationId: SettlementController_approve
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: draft → approved
      tags:
        - settlement
  /api/settlements/{id}/execute:
    post:
      operationId: SettlementController_execute
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: Pays pending payouts and syncs those in flight; call again until
        executed. 409 when the gateway refuses a payout, or in open-payments
        mode before the liquidation grant is approved.
      tags:
        - settlement
  /api/settlements/{id}/liquidation-grant:
    post:
      operationId: SettlementController_startLiquidationGrant
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: "RF-26: the fiduciaria approves the liquidation grant on custody (Σ COP
        payouts); redirect_url is null in simulated mode (nothing to approve).
        409 unless approved"
      tags:
        - settlement
  /api/settlements/{id}:
    get:
      operationId: SettlementController_get
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: A settlement with its plan, payouts and receipts; another producer's is
        a 404
      tags:
        - settlement
  /api/simulation/presets:
    get:
      operationId: SimulationController_presets
      parameters: []
      responses:
        "200":
          description: ""
      summary: The PRD demo projects (P1 not publishable, P2 publishable) the motor
        starts from
      tags:
        - simulation
  /api/projects/{projectId}/simulation:
    post:
      operationId: SimulationController_run
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        "201":
          description: ""
      summary: Runs the motor (20.000 scenarios, fixed seed) from a preset plus
        overrides and stores the run
      tags:
        - simulation
    get:
      operationId: SimulationController_latest
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: The project's latest sheet; 404 when it was never simulated
      tags:
        - simulation
  /api/projects/{projectId}/publish:
    post:
      operationId: SimulationController_publish
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponseDto"
      summary: "DRAFT → FUNDING_IN_PROGRESS when the latest sheet passes the offer
        rule; 409 { errors: { _form } } otherwise"
      tags:
        - simulation
  /api/projects/{projectId}/admission:
    post:
      operationId: AdmissionController_assess
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        "201":
          description: ""
      summary: Nine filters with evidence plus the seven A15 blocks → binary result,
        score, level, milestones, financeable %, jornales line
      tags:
        - simulation
    get:
      operationId: AdmissionController_latest
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: The project's latest admission; 404 before the first one
      tags:
        - simulation
  /api/projects/{projectId}/purchase-contract:
    get:
      operationId: ContractsController_purchaseContract
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: RF-04; 404 while the project has none
      tags:
        - contracts
    put:
      operationId: ContractsController_putPurchaseContract
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: "RF-04: creates or replaces it before publishing; the buyer by email,
        their wallet validated (GET in open-payments mode)"
      tags:
        - contracts
  /api/projects/{projectId}/insurance-policy:
    get:
      operationId: ContractsController_policy
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: RF-05; 404 while the project has none
      tags:
        - contracts
    put:
      operationId: ContractsController_putPolicy
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: "RF-05: the latest simulation's premium and terms win; without one they
        come in the body. 409 once the premium was paid"
      tags:
        - contracts
  /api/projects/{projectId}/insurance-policy/premium-grant:
    post:
      operationId: ContractsController_startPremiumGrant
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: "RF-14: the fiduciaria approves the premium grant on custody (net
        premium cap); redirect_url is null in simulated mode"
      tags:
        - contracts
  /api/projects/{projectId}/insurance-policy/pay-premium:
    post:
      operationId: ContractsController_payPremium
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: "RF-14: pays the net premium from custody to the insurer (or syncs one
        in flight); 409 before activation or without the grant"
      tags:
        - contracts
  /api/projects/{projectId}/insurance-policy/claims:
    get:
      operationId: ContractsController_claims
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags:
        - contracts
    post:
      operationId: ContractsController_fileClaim
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        "201":
          description: ""
      summary: "RF-25: validates the threshold or index rule and computes the A6
        indemnity; in open-payments mode opens the incoming payment on custody"
      tags:
        - contracts
  /api/projects/{projectId}/insurance-policy/claims/{claimId}/confirm:
    post:
      operationId: ContractsController_confirmClaim
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: claimId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: "RF-25: books the indemnity into custody (ledger CREDIT INDEMNITY); in
        open-payments mode only once the insurer paid it"
      tags:
        - contracts
  /api/projects/{projectId}/contract:
    get:
      operationId: ContractsController_contract
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: "RF-09: the latest version with its signatures; the parties (the buyer
        included) read it"
      tags:
        - contracts
    post:
      operationId: ContractsController_generateContract
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: "RF-09: renders the template; unchanged terms answer the current
        version, changed ones a new version without signatures"
      tags:
        - contracts
  /api/contracts/{id}/signatures:
    post:
      operationId: ContractsController_sign
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "201":
          description: ""
      summary: "RF-09: the caller signs every party they are on the latest version
        (user, role, time, ip, user agent, hash)"
      tags:
        - contracts
  /api/assistant/messages:
    post:
      operationId: AssistantController_sendMessage
      parameters: []
      responses:
        "200":
          description: ""
      summary: Send a message; answers the reply and, when a tool prepared one, the
        pending intent to confirm
      tags:
        - assistant
  /api/assistant/conversations/{id}:
    get:
      operationId: AssistantController_getConversation
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: The producer's own conversation with its messages and intents (RF-41
        audit)
      tags:
        - assistant
  /api/assistant/intents/{id}/confirm:
    post:
      operationId: AssistantController_confirm
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: Explicit «sí»; order lines also need { pin }
      tags:
        - assistant
  /api/assistant/intents/{id}/reject:
    post:
      operationId: AssistantController_reject
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags:
        - assistant
  /api/assistant/pin:
    get:
      operationId: AssistantController_pinStatus
      parameters: []
      responses:
        "200":
          description: ""
      summary: Whether the producer has a PIN, so the UI can ask to create one before
        the first order
      tags:
        - assistant
    put:
      operationId: AssistantController_setPin
      parameters: []
      responses:
        "204":
          description: ""
      summary: Create the 4-digit PIN, or change it with { pin, current_pin }
      tags:
        - assistant
  /api/suppliers:
    post:
      operationId: PayoutsController_registerSupplier
      parameters: []
      responses:
        "201":
          description: ""
      summary: Registers a supplier; 400 unless its wallet resolves and receives COP,
        409 for a repeated name
      tags:
        - payouts
    get:
      operationId: PayoutsController_listSuppliers
      parameters: []
      responses:
        "200":
          description: ""
      summary: Registered suppliers, oldest first
      tags:
        - payouts
  /api/milestones/{id}/orders:
    get:
      operationId: PayoutsController_listOrders
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: Orders the producer confirmed through the assistant for this milestone,
        with their approval state
      tags:
        - payouts
  /api/milestones/{id}/orders/{intentId}/approve:
    post:
      operationId: PayoutsController_approveOrder
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: intentId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: Turns a confirmed order into a proveedor line of the milestone
        (remaining_cap in whole pesos after it); 409 when it does not fit the
        cap or the supplier is not registered
      tags:
        - payouts
  /api/milestones/{id}/orders/{intentId}/reject:
    post:
      operationId: PayoutsController_rejectOrder
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: intentId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: Rejects a confirmed order; no line is created
      tags:
        - payouts
  /api/harvests:
    get:
      operationId: HarvestController_list
      parameters: []
      responses:
        "200":
          description: ""
      summary: "RF-24: the verifier's queue, every harvest with its project (verifier
        or admin; the verifier must sign in)"
      tags:
        - harvest
  /api/projects/{projectId}/harvest:
    get:
      operationId: HarvestController_get
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: The project's harvest (null before the declaration) and project status
      tags:
        - harvest
    post:
      operationId: HarvestController_declare
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        "201":
          description: ""
      summary: "The owner producer declares the harvest: HARVEST_DECLARED"
      tags:
        - harvest
  /api/projects/{projectId}/harvest/certify:
    post:
      operationId: HarvestController_certify
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: "The verifier certifies Q and quality; the contract formula (or the
        request's price) sets Q·P_g: HARVEST_CERTIFIED"
      tags:
        - harvest
  /api/projects/{projectId}/harvest/payment:
    post:
      operationId: HarvestController_pay
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: "The buyer pays Q·P_g into custody: MARKET_PAYMENT_HELD at once
        (simulated) or payment_redirect_url to approve in the wallet"
      tags:
        - harvest
  /api/projects/{projectId}/harvest/reception:
    post:
      operationId: HarvestController_reception
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: "The paying buyer confirms reception: DELIVERED_TO_BUYER, which lets
        the settlement execute"
      tags:
        - harvest
  /api/projects/{projectId}/custody:
    get:
      operationId: HarvestController_custody
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: "RF-21: what is still in custody, with credits by category and debits
        (milestone lines, liquidation payouts)"
      tags:
        - harvest
  /api/investor/projects/{projectId}/panel:
    get:
      operationId: HarvestController_panel
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: "RF-27: the investor's position (every investment for fidu and admin):
        capture, custody, grants, receipts, realized vs median TIR"
      tags:
        - harvest
  /api/notifications:
    get:
      operationId: NotificationsController_list
      parameters: []
      responses:
        "200":
          description: ""
      summary: Newest first, at most 50
      tags:
        - notifications
  /api/notifications/{id}/read:
    post:
      operationId: NotificationsController_markRead
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: Marks one read; another user's notice is a 404
      tags:
        - notifications
info:
  title: Agro Payments API
  description: ""
  version: 0.1.0
  contact: {}
tags: []
servers: []
components:
  schemas:
    CurrentUserResponseDto:
      type: object
      properties:
        role:
          enum:
            - admin
            - buyer
            - seller
            - investor
            - fidu
            - intermediator
            - verifier
          type: string
        id:
          type: string
        email:
          type: string
        name:
          type: string
      required:
        - role
        - id
        - email
        - name
    AssignRoleDto:
      type: object
      properties:
        role:
          description: New role for the user
          enum:
            - admin
            - buyer
            - seller
            - investor
            - fidu
            - intermediator
            - verifier
          type: string
      required:
        - role
    AssignedRoleResponseDto:
      type: object
      properties:
        role:
          enum:
            - admin
            - buyer
            - seller
            - investor
            - fidu
            - intermediator
            - verifier
          type: string
        id:
          type: string
      required:
        - role
        - id
    MilestoneStatus:
      type: string
      enum:
        - draft
        - evidence_submitted
        - approved
        - observado
    EvidenceDto:
      type: object
      properties:
        description:
          type: string
        submittedAt:
          format: date-time
          type: string
      required:
        - description
        - submittedAt
    Decision:
      type: string
      enum:
        - approved
        - observado
    ReviewDto:
      type: object
      properties:
        decision:
          allOf:
            - $ref: "#/components/schemas/Decision"
        reason:
          type: string
          nullable: true
        reviewedAt:
          format: date-time
          type: string
      required:
        - decision
        - reason
        - reviewedAt
    LineKind:
      type: string
      enum:
        - productor
        - proveedor
        - trabajadores
        - plataforma
    LineStatus:
      type: string
      enum:
        - pendiente
        - en_cola
        - completado
        - fallido
    ReceiptAmountDto:
      type: object
      properties:
        value:
          type: number
          description: Integer minor units of assetCode
        assetCode:
          type: string
        assetScale:
          type: number
      required:
        - value
        - assetCode
        - assetScale
    LineReceiptDto:
      type: object
      properties:
        incomingPaymentId:
          type: string
          nullable: true
        outgoingPaymentId:
          type: string
          nullable: true
        quoteId:
          type: string
          nullable: true
        debitAmount:
          nullable: true
          description: Charged to the milestone grant on the custody wallet
          type: object
          allOf:
            - $ref: "#/components/schemas/ReceiptAmountDto"
        receiveAmount:
          nullable: true
          description: "Credited to the beneficiary: quoted while en_cola, settled once
            completado"
          type: object
          allOf:
            - $ref: "#/components/schemas/ReceiptAmountDto"
        rate:
          type: string
          nullable: true
          description: Implied receive/debit rate in major units, as a reduced
            "numerator/denominator" string
          example: 300/301
        fee:
          type: number
          nullable: true
          description: debit − receive in debit minor units; null when the assets differ
        grantSpentBefore:
          type: number
          nullable: true
          description: Grant debit total before this payment, minor units
        grantSpentAfter:
          type: number
          nullable: true
          description: Grant debit total re-read after settlement, minor units
      required:
        - incomingPaymentId
        - outgoingPaymentId
        - quoteId
        - debitAmount
        - receiveAmount
        - rate
        - fee
        - grantSpentBefore
        - grantSpentAfter
    LineDto:
      type: object
      properties:
        kind:
          allOf:
            - $ref: "#/components/schemas/LineKind"
        status:
          allOf:
            - $ref: "#/components/schemas/LineStatus"
        reference:
          type: string
          nullable: true
          description: Gateway payment reference; simulated ones start with SIM-, Open
            Payments ones hold the incoming and outgoing payment URLs
        settledAt:
          format: date-time
          type: string
          nullable: true
        receipt:
          nullable: true
          description: Null until the gateway reports the payment (simulated payments have
            none)
          type: object
          allOf:
            - $ref: "#/components/schemas/LineReceiptDto"
        id:
          type: string
        beneficiary:
          type: string
        walletAddress:
          type: string
        amount:
          type: number
          description: Integer minor units (see assetScale)
      required:
        - kind
        - status
        - reference
        - settledAt
        - receipt
        - id
        - beneficiary
        - walletAddress
        - amount
    MilestoneDto:
      type: object
      properties:
        status:
          allOf:
            - $ref: "#/components/schemas/MilestoneStatus"
        evidence:
          nullable: true
          type: object
          allOf:
            - $ref: "#/components/schemas/EvidenceDto"
        review:
          nullable: true
          type: object
          allOf:
            - $ref: "#/components/schemas/ReviewDto"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/LineDto"
        fundedAt:
          format: date-time
          type: string
          nullable: true
          description: Set when the custody grant that funds the lines was approved; no
            line is paid before
        closedAt:
          format: date-time
          type: string
          nullable: true
          description: Set once every line is completado or fallido
        id:
          type: string
        title:
          type: string
        amount:
          type: number
          description: "Integer minor units: amount / 10^assetScale is the human value"
        currency:
          type: string
          description: ISO 4217 code
        assetScale:
          type: number
          description: Decimal places of the minor unit (COP demo data uses 2)
      required:
        - status
        - evidence
        - review
        - lines
        - fundedAt
        - closedAt
        - id
        - title
        - amount
        - currency
        - assetScale
    SubmitEvidenceDto:
      type: object
      properties:
        description:
          type: string
          description: What the producer did and what the evidence shows
      required:
        - description
    ReviewMilestoneDto:
      type: object
      properties:
        decision:
          allOf:
            - $ref: "#/components/schemas/Decision"
        reason:
          type: string
          description: "Required when observing: what the producer must correct"
      required:
        - decision
    FundingStartDto:
      type: object
      properties:
        redirectUrl:
          type: string
          description: Wallet consent page; the browser leaves the app and comes back
            through the funding callback
      required:
        - redirectUrl
    ProjectStatus:
      type: string
      enum:
        - DRAFT
        - CONTRACT_SIGNED
        - FUNDING_IN_PROGRESS
        - FUNDED_IN_CUSTODY
        - IN_EXECUTION
        - HARVEST_DECLARED
        - HARVEST_CERTIFIED
        - LISTED_IN_MARKET
        - MARKET_PAYMENT_HELD
        - DELIVERED_TO_BUYER
        - SETTLEMENT_PROCESSING
        - SETTLED_AND_CLOSED
        - CANCELLED_OR_DISPUTED
    ProjectResponseDto:
      type: object
      properties:
        current_status:
          allOf:
            - $ref: "#/components/schemas/ProjectStatus"
        plot_polygon:
          type: object
          description: "RF-01: GeoJSON Polygon of the plot; omitted when not drawn"
        id:
          type: string
        project_code:
          type: string
          description: AGR-YYYY-NNN, sequential per year
        title:
          type: string
        production_type:
          type: string
        description:
          type: string
        target_amount:
          type: number
          description: Σ(supplies + labor) of the milestones, whole pesos; the platform
            fee is on top
        custody_balance:
          type: number
        total_disbursed:
          type: number
        investor_roi_pct:
          type: number
        platform_fee_pct:
          type: number
        start_date:
          type: string
          description: yyyy-mm-dd
        estimated_end_date:
          type: string
        currency:
          type: string
        producer_wallet_address:
          type: string
          description: "RF-01: the producer's COP wallet, paid by the productor line;
            omitted when not given"
      required:
        - current_status
        - id
        - project_code
        - title
        - production_type
        - description
        - target_amount
        - custody_balance
        - total_disbursed
        - investor_roi_pct
        - platform_fee_pct
        - start_date
        - estimated_end_date
        - currency
    ApiErrorDto:
      type: object
      properties:
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        error:
          type: string
      required:
        - errors
        - error
    RequirementDto:
      type: object
      properties:
        type:
          enum:
            - number
            - boolean_system_check
            - photo_array
          type: string
        field_key:
          type: string
        label:
          type: string
        min:
          type: number
        max:
          type: number
        min_items:
          type: number
      required:
        - type
        - field_key
        - label
    RequirementsSchemaDto:
      type: object
      properties:
        required_evidences:
          type: array
          items:
            $ref: "#/components/schemas/RequirementDto"
      required:
        - required_evidences
    CreateProjectMilestoneRequestDto:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        estimated_completion_date:
          type: string
          description: yyyy-mm-dd, within the project period
        supplies_budget:
          type: number
          description: Whole pesos
        labor_budget:
          type: number
          description: Whole pesos; must be above zero (it pays the producer line)
        sequence_order:
          type: number
          description: 1-based; milestones open in this order
        requirements_schema:
          $ref: "#/components/schemas/RequirementsSchemaDto"
      required:
        - title
        - description
        - estimated_completion_date
        - supplies_budget
        - labor_budget
        - sequence_order
        - requirements_schema
    CreateProjectRequestDto:
      type: object
      properties:
        production_type:
          type: string
          enum:
            - CAFE_ESPECIAL
            - CACAO
            - AGUACATE_HASS
            - OTRO
        milestones:
          type: array
          items:
            $ref: "#/components/schemas/CreateProjectMilestoneRequestDto"
        title:
          type: string
        description:
          type: string
        start_date:
          type: string
        estimated_end_date:
          type: string
      required:
        - production_type
        - milestones
        - title
        - description
        - start_date
        - estimated_end_date
    MilestoneProgressStatus:
      type: string
      enum:
        - LOCKED
        - ACTIVE
        - SUPPLIES_ORDERED
        - SUPPLIES_PAID
        - IN_FIELD_EXECUTION
        - SUBMITTED_FOR_REVIEW
        - CHANGES_REQUESTED
        - TECHNICALLY_APPROVED
        - LABOR_PAYOUT_PENDING
        - COMPLETED_AND_PAID
      description: Derived from the milestone, its lines and the project order (see
        milestone-progress.ts)
    MilestoneSummaryResponseDto:
      type: object
      properties:
        status:
          description: Derived from the milestone, its lines and the project order (see
            milestone-progress.ts)
          allOf:
            - $ref: "#/components/schemas/MilestoneProgressStatus"
        id:
          type: string
        project_id:
          type: string
          description: Empty for the legacy demo milestones, which belong to no project
        sequence_order:
          type: number
          description: 0 for the legacy demo milestones
        title:
          type: string
        supplies_budget:
          type: number
          description: Σ proveedor lines
        labor_budget:
          type: number
          description: Σ productor + trabajadores lines
        supplies_executed:
          type: number
        labor_executed:
          type: number
        currency:
          type: string
      required:
        - status
        - id
        - project_id
        - sequence_order
        - title
        - supplies_budget
        - labor_budget
        - supplies_executed
        - labor_executed
        - currency
    EvidenceLogType:
      type: string
      enum:
        - PHOTO_EVIDENCE
        - SOIL_ANALYSIS
        - IOT_READING
        - WEATHER_ALERT
        - AGRONOMIC_NOTE
    PhotoHashDto:
      type: object
      properties:
        url:
          type: string
        sha256:
          type: string
      required:
        - url
        - sha256
    EvidenceLocationDto:
      type: object
      properties:
        latitude:
          type: number
        longitude:
          type: number
      required:
        - latitude
        - longitude
    EvidenceLogResponseDto:
      type: object
      properties:
        log_type:
          allOf:
            - $ref: "#/components/schemas/EvidenceLogType"
        evidence_payload:
          type: object
          additionalProperties:
            oneOf:
              - type: number
              - type: boolean
              - type: array
                items:
                  type: string
        photo_hashes:
          description: "RF-19/RF-35: sha256 (hex) per photo URL; present only when reported"
          type: array
          items:
            $ref: "#/components/schemas/PhotoHashDto"
        id:
          type: string
        milestone_id:
          type: string
        notes:
          type: string
        created_at:
          type: string
        location:
          nullable: true
          description: "RF-19/RF-35: where the evidence was taken; present only when
            reported"
          type: object
          allOf:
            - $ref: "#/components/schemas/EvidenceLocationDto"
      required:
        - log_type
        - evidence_payload
        - id
        - milestone_id
        - notes
        - created_at
    MilestoneReviewVerdict:
      type: string
      enum:
        - SUBMITTED
        - CHANGES_REQUESTED
        - APPROVED_FAVORABLE
        - PAYOUT_EXECUTED
    MilestoneReviewResponseDto:
      type: object
      properties:
        verdict:
          allOf:
            - $ref: "#/components/schemas/MilestoneReviewVerdict"
        comment:
          type: string
          nullable: true
        id:
          type: string
        created_at:
          type: string
      required:
        - verdict
        - comment
        - id
        - created_at
    MilestoneDetailResponseDto:
      type: object
      properties:
        status:
          description: Derived from the milestone, its lines and the project order (see
            milestone-progress.ts)
          allOf:
            - $ref: "#/components/schemas/MilestoneProgressStatus"
        required_evidences:
          type: array
          items:
            $ref: "#/components/schemas/RequirementDto"
        evidence_logs:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceLogResponseDto"
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/MilestoneReviewResponseDto"
        description:
          type: string
        estimated_completion_date:
          type: string
          description: yyyy-mm-dd; omitted when unknown (legacy demo milestones)
        id:
          type: string
        project_id:
          type: string
          description: Empty for the legacy demo milestones, which belong to no project
        sequence_order:
          type: number
          description: 0 for the legacy demo milestones
        title:
          type: string
        supplies_budget:
          type: number
          description: Σ proveedor lines
        labor_budget:
          type: number
          description: Σ productor + trabajadores lines
        supplies_executed:
          type: number
        labor_executed:
          type: number
        currency:
          type: string
      required:
        - status
        - required_evidences
        - evidence_logs
        - reviews
        - description
        - id
        - project_id
        - sequence_order
        - title
        - supplies_budget
        - labor_budget
        - supplies_executed
        - labor_executed
        - currency
    EvidenceLogRequestDto:
      type: object
      properties:
        log_type:
          allOf:
            - $ref: "#/components/schemas/EvidenceLogType"
        evidence_payload:
          type: object
          additionalProperties:
            oneOf:
              - type: number
              - type: boolean
              - type: array
                items:
                  type: string
          description: "Exactly the milestone's required_evidences keys: numbers within
            min/max, booleans, http(s) photo URLs"
        photo_hashes:
          description: "RF-19/RF-35, optional: one sha256 hex per photo URL of
            evidence_payload"
          type: array
          items:
            $ref: "#/components/schemas/PhotoHashDto"
        notes:
          type: string
          description: At most 1000 characters
        location:
          description: "RF-19/RF-35, optional: latitude ±90, longitude ±180"
          allOf:
            - $ref: "#/components/schemas/EvidenceLocationDto"
      required:
        - log_type
        - evidence_payload
        - notes
