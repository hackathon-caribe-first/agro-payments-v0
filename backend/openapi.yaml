openapi: 3.0.0
paths:
  /users/me:
    get:
      operationId: CurrentUserController_me
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponseDto"
      summary: Get the authenticated user
      tags:
        - users
  /users/{id}/role:
    patch:
      operationId: UserRolesController_assign
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignRoleDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignedRoleResponseDto"
      summary: Assign any role to a user (admin only)
      tags:
        - users
  /milestones:
    get:
      operationId: MilestonesController_list
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MilestoneDto"
      summary: List milestones
      tags:
        - milestones
  /milestones/{id}:
    get:
      operationId: MilestonesController_get
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneDto"
      summary: Get a milestone
      tags:
        - milestones
  /milestones/{id}/evidence:
    post:
      operationId: MilestonesController_addEvidence
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitEvidenceDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneDto"
      summary: Producer submits evidence for verification
      tags:
        - milestones
  /milestones/{id}/review:
    post:
      operationId: MilestonesController_review
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewMilestoneDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneDto"
      summary: Verifier approves or rejects the evidence. Approving does not order a
        payment.
      tags:
        - milestones
  /milestones/{id}/payment:
    post:
      operationId: MilestonesController_pay
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneDto"
      summary: Custodian orders the simulated 50/30/20 payment of an approved milestone
      tags:
        - milestones
  /milestones/{id}/payment/confirmation:
    post:
      operationId: MilestonesController_confirm
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneDto"
      summary: Custodian confirms the simulated payment was received
      tags:
        - milestones
info:
  title: Agro Payments API
  description: ""
  version: 0.1.0
  contact: {}
tags: []
servers: []
components:
  schemas:
    CurrentUserResponseDto:
      type: object
      properties:
        role:
          enum:
            - admin
            - buyer
            - seller
            - investor
            - fidu
            - intermediator
          type: string
        id:
          type: string
        email:
          type: string
        name:
          type: string
      required:
        - role
        - id
        - email
        - name
    AssignRoleDto:
      type: object
      properties:
        role:
          description: New role for the user
          enum:
            - admin
            - buyer
            - seller
            - investor
            - fidu
            - intermediator
          type: string
      required:
        - role
    AssignedRoleResponseDto:
      type: object
      properties:
        role:
          enum:
            - admin
            - buyer
            - seller
            - investor
            - fidu
            - intermediator
          type: string
        id:
          type: string
      required:
        - role
        - id
    CreatePaymentDto:
      type: object
      properties:
        description:
          type: string
        submittedAt:
          format: date-time
          type: string
      required:
        - description
        - submittedAt
    Decision:
      type: string
      enum:
        - approved
        - rejected
    ReviewDto:
      type: object
      properties:
        decision:
          allOf:
            - $ref: "#/components/schemas/Decision"
        reason:
          type: string
          nullable: true
        reviewedAt:
          format: date-time
          type: string
      required:
        - decision
        - reason
        - reviewedAt
    PaymentStatus:
      type: string
      enum:
        - processing
        - confirmed
    Recipient:
      type: string
      enum:
        - productor
        - proveedor
        - trabajadores
    ShareDto:
      type: object
      properties:
        recipient:
          allOf:
            - $ref: "#/components/schemas/Recipient"
        percent:
          type: number
        amount:
          type: number
          description: Whole currency units
      required:
        - recipient
        - percent
        - amount
    PaymentDto:
      type: object
      properties:
        status:
          allOf:
            - $ref: "#/components/schemas/PaymentStatus"
        shares:
          type: array
          items:
            $ref: "#/components/schemas/ShareDto"
        confirmedAt:
          format: date-time
          type: string
          nullable: true
        reference:
          type: string
          description: Simulated transfer reference, never a real bank reference
        orderedAt:
          format: date-time
          type: string
      required:
        - status
        - shares
        - confirmedAt
        - reference
        - orderedAt
    MilestoneDto:
      type: object
      properties:
        status:
          allOf:
            - $ref: "#/components/schemas/MilestoneStatus"
        evidence:
          nullable: true
          type: object
          allOf:
            - $ref: "#/components/schemas/EvidenceDto"
        review:
          nullable: true
          type: object
          allOf:
            - $ref: "#/components/schemas/ReviewDto"
        payment:
          nullable: true
          type: object
          allOf:
            - $ref: "#/components/schemas/PaymentDto"
        id:
          type: string
        title:
          type: string
        amount:
          type: number
          description: Whole currency units
        currency:
          type: string
          description: ISO 4217 code
      required:
        - status
        - evidence
        - review
        - payment
        - id
        - title
        - amount
        - currency
    SubmitEvidenceDto:
      type: object
      properties:
        description:
          type: string
          description: What the producer did and what the evidence shows
      required:
        - description
    ReviewMilestoneDto:
      type: object
      properties:
        decision:
          allOf:
            - $ref: "#/components/schemas/Decision"
        reason:
          type: string
          description: "Required when rejecting: what the producer must correct"
      required:
        - decision
