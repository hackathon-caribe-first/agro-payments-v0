server {
  listen 80;
  root /usr/share/nginx/html;

  # Same-origin API, like the Vite dev proxy: the web transport sends no credentials, so the session cookie only travels same-origin.
  location ~ ^/(api|milestones|users|docs)(/|$) {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA (ssr: false): unknown paths fall back to the client router.
  location / { try_files $uri $uri/ /index.html; }
}
